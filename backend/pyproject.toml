[project]
name = "ragi-instant"
version = "0.1.0"
description = "Regulatory & Compliance Intelligence RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "llama-index-core>=0.12",
    "llama-index-embeddings-openai>=0.3",
    "openai>=1.50",
    "cohere>=5.10",
    "instructor>=1.5",
    "langfuse>=2.50",
    "ragas>=0.2",
    "docling>=2.0",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
