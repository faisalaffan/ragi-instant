name: Scheduled

on:
  schedule:
    - cron: '7 8 * * *'  # 08:07 WIB (01:07 UTC) — off-peak, tidak jam 00:00
  workflow_dispatch:      # bisa trigger manual

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: pip-audit (Python CVE scan)
        run: |
          pip install pip-audit
          pip-audit -r <(cd backend && python3 -c "
          import tomllib
          d=tomllib.load(open('pyproject.toml','rb'))
          for dep in d['project']['dependencies']:
              print(dep)
          ") 2>&1 || echo "Vulnerabilities found — review required"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: npm audit (JS CVE scan)
        working-directory: frontend
        run: npm audit --audit-level=high 2>&1 || echo "High severity issues found"

  stale-check:
    name: Dependency Freshness
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check outdated Python deps
        run: |
          cd backend
          pip install pip-audit 2>/dev/null
          python3 -c "
          import subprocess, sys
          result = subprocess.run([sys.executable, '-m', 'pip', 'list', '--outdated', '--format=columns'],
                                  capture_output=True, text=True)
          outdated = [l for l in result.stdout.split('\n') if l.strip() and 'Package' not in l]
          if outdated:
              print(f'{len(outdated)} outdated packages:')
              print('\n'.join(outdated[:15]))
          else:
              print('All Python packages up to date')
          "

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check outdated JS deps
        working-directory: frontend
        run: npm outdated 2>&1 || true
